<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thndr Companion — أداة اتخاذ قرار الاستثمار</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Sidebar navigation -->
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">TC</div>
        <div class="brand-text">
          <strong>Thndr Companion</strong>
          <span data-i18n="brand.tagline">أداة اتخاذ القرار</span>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-footer">
        <button class="lang-toggle" id="langToggle" title="Language / اللغة">
          <span id="langLabel">EN</span>
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menuBtn" aria-label="menu">☰</button>
        <h1 id="pageTitle"></h1>
        <button class="ref-btn" id="refBtn">
          <span data-i18n="ref.open">📚 المرجع السريع</span>
        </button>
      </header>
      <div class="page-container" id="page"></div>
    </main>

    <!-- Reference panel (drawer) -->
    <div class="drawer-overlay" id="drawerOverlay"></div>
    <div id="referencePanel"></div>
  </div>

  <div id="toast" class="toast"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
